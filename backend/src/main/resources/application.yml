spring:
  datasource:
    url: jdbc:h2:file:./data/resumeiq;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# OpenRouter Configuration
openrouter:
  api:
    key: ${OPENROUTER_API_KEY}
    url: https://openrouter.ai/api/v1/chat/completions
    model: meta-llama/llama-3.1-8b-instruct:free

# JWT Security Configurations
security:
  jwt:
    secret-key: ${JWT_SECRET:407F16592238495579248467473726395370724F537652754F655768584D4E34}
    expiration-time: 86400000

# Logging Configuration
logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    com.resumeiq.backend: DEBUG